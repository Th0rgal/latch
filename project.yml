name: Latch
options:
  bundleIdPrefix: md.thomas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

schemes:
  Latch:
    build:
      targets:
        Latch: all
    test:
      targets: [LatchTests]
    run:
      config: Debug
    archive:
      config: Release

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: md.thomas.latch
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: BQ6Z84B8L5
    SWIFT_VERSION: "5.9"
    ENABLE_TESTABILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Latch:
    type: application
    platform: iOS
    sources:
      - path: Latch
        excludes:
          - Info.plist
          - Latch.entitlements
    settings:
      base:
        INFOPLIST_FILE: Latch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Latch/Latch.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

  LatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Latch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
